<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pelican Coast Ride · 鹈鹕骑自行车</title>
<style>
  :root{
    --paper:#f5f2e9;
    --ink:#172427;
    --muted:#657477;
    --line:#c9d2cf;
    --sea:#9fc7c8;
    --sea-dark:#6e9fa2;
    --sky:#dbe9e6;
    --sand:#dfcda6;
    --coral:#d66f57;
    --yellow:#e3b74f;
    --white:#fbfaf6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  body{padding:clamp(18px,3vw,38px)}
  .shell{width:min(1280px,100%);margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:16px}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{font-size:clamp(28px,4.6vw,58px);line-height:.98;letter-spacing:-.045em;margin:7px 0 0;font-weight:750}
  .meta{max-width:360px;text-align:right;color:var(--muted);font-size:13px;line-height:1.6}
  .stage{border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#eef1eb;box-shadow:0 18px 54px rgba(28,45,45,.08)}
  svg{display:block;width:100%;height:auto;aspect-ratio:1170/720}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:1px solid var(--line);background:rgba(245,242,233,.92);backdrop-filter:blur(10px)}
  .control-left,.speed-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{font:inherit;border:1px solid #afbbb8;background:transparent;color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
  button:hover{transform:translateY(-1px)}
  button:focus-visible{outline:3px solid rgba(110,159,162,.35);outline-offset:2px}
  #play{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:104px}
  .speed[aria-pressed="true"]{background:#d9e7e3;border-color:#8fa6a2}
  .hint{font-size:12px;color:var(--muted)}
  .signature{display:flex;justify-content:space-between;gap:16px;margin-top:11px;color:#83908e;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:680px){
    body{padding:12px}
    .topbar{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:12px}
    .meta{text-align:left;max-width:none}
    .stage{border-radius:19px}
    .controls{align-items:flex-start;flex-direction:column;padding:12px}
    .control-left,.speed-group{width:100%}
    #play{flex:1}
    .speed{flex:1;padding-inline:8px}
    .signature{font-size:9px;letter-spacing:.05em}
  }
  @media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main class="shell">

    <div>
      <div class="eyebrow">MOTION STUDY · 01</div>
      <h1>Pelican Coast Ride</h1>

    <div class="meta">一只鹈鹕沿海岸持续骑行。脚踏、双腿和车轮采用同一运动相位，背景与围巾保持轻微视差。</div>

        </g>
        <g aria-hidden="true">

          <path d="M604 190 C667 202 756 207 819 183 C784 227 692 239 627 217 C613 212 605 201 604 190Z" fill="#efc45b" stroke="#b98e34" stroke-width="4"/>
          <path d="M818 183 L842 182 L824 194Z" fill="#d66f57"/>

          <path d="M560 344 C620 344 684 365 748 362" fill="none" stroke="#aeb9b5" stroke-width="4" stroke-linecap="round"/>

        <path id="near-leg" d="M545 400 L563 475 L621 524" fill="none" stroke="#f7f6f0" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="near-foot" d="M613 525 l40 4" fill="none" stroke="#ddb04a" stroke-width="14" stroke-linecap="round"/>

          <line x1="-7" y1="0" x2="23" y2="0" stroke="#243436" stroke-width="8" stroke-linecap="round"/>

          <line x1="-7" y1="0" x2="25" y2="0" stroke="#182628" stroke-width="9" stroke-linecap="round"/>

    <div class="controls">

  <div class="signature"><span>SVG / VANILLA JS / NO DEPENDENCIES</span><span>COASTAL LOOP · RESPONSIVE</span></div>
</main>
<script>
(function(){
  const CX=585, CY=540, CRANK=44;
  const UPPER=79, LOWER=108;
  const nearHip={x:545,y:400};
  const farHip={x:565,y:405};
  const nearPedal=document.getElementById('near-pedal');
  const farPedal=document.getElementById('far-pedal');
  const frontSpokes=document.getElementById('front-spokes');
  const rearSpokes=document.getElementById('rear-spokes');
  const roadMarks=document.getElementById('road-marks');
  const motionLayer=document.getElementById('motion-layer');
  const scarfMain=document.getElementById('scarf-main');
  const scarfTail=document.getElementById('scarf-tail');
  const wing=document.getElementById('wing');
  const riderBody=document.getElementById('rider-body');
  const play=document.getElementById('play');
  const speedButtons=[...document.querySelectorAll('.speed')];
  let speed=1, playing=true, raf=0, last=0, phase=0, wheel=0, travel=0;
  function n(v){return Number(v.toFixed(6));}
  function solveLeg(hip,foot,bend){
    const dx=foot.x-hip.x, dy=foot.y-hip.y;
    let d=Math.hypot(dx,dy);
    d=Math.max(Math.abs(LOWER-UPPER)+0.0001,Math.min(UPPER+LOWER-0.0001,d));
    const ux=dx/d, uy=dy/d;
    const along=(UPPER*UPPER-LOWER*LOWER+d*d)/(2*d);
    const h=Math.sqrt(Math.max(0,UPPER*UPPER-along*along));
    const px=-uy, py=ux;
    return {x:hip.x+ux*along+px*h*bend,y:hip.y+uy*along+py*h*bend};
  }
  function legPath(hip,pedal,side){
    const foot={x:pedal.x-8,y:pedal.y-16};
    const knee=solveLeg(hip,foot,-1);
    const leg=document.getElementById(side+'-leg');
    const footNode=document.getElementById(side+'-foot');
    leg.setAttribute('d',`M${n(hip.x)} ${n(hip.y)} L${n(knee.x)} ${n(knee.y)} L${n(foot.x)} ${n(foot.y)}`);
    footNode.setAttribute('d',`M${n(foot.x-7)} ${n(foot.y+1)} L${n(foot.x+31)} ${n(foot.y+5)}`);
  }
  function update(t){
    const c=Math.cos(phase), s=Math.sin(phase);
    const near={x:CX+c*CRANK,y:CY+s*CRANK};
    const far={x:CX-c*CRANK,y:CY-s*CRANK};
    nearPedal.setAttribute('transform',`translate(${n(near.x)} ${n(near.y)})`);
    farPedal.setAttribute('transform',`translate(${n(far.x)} ${n(far.y)})`);
    legPath(nearHip,near,'near');
    legPath(farHip,far,'far');
    frontSpokes.setAttribute('transform',`rotate(${n(wheel)} 790 560)`);
    rearSpokes.setAttribute('transform',`rotate(${n(wheel)} 395 560)`);
    const road=-((travel*1.7)%265);
    const distant=-((travel*.22)%1170);
    roadMarks.setAttribute('transform',`translate(${n(road)} 0)`);
    motionLayer.setAttribute('transform',`translate(${n(distant)} 0)`);
    const flutter=Math.sin(t*.012)*7+Math.sin(t*.023)*3;
    scarfMain.setAttribute('d',`M527 244 C486 ${n(257+flutter*.25)} 450 ${n(247-flutter*.35)} 410 ${n(258+flutter)} C378 ${n(267+flutter*.5)} 349 ${n(285-flutter*.2)} 315 ${n(273+flutter*.65)}`);
    scarfTail.setAttribute('d',`M517 251 C477 ${n(281-flutter*.35)} 441 ${n(281+flutter*.5)} 410 ${n(300+flutter*.8)} C385 ${n(315+flutter*.2)} 367 ${n(333-flutter*.35)} 335 ${n(333+flutter*.45)}`);
    const bob=Math.sin(phase*2)*3.2;
    riderBody.setAttribute('transform',`translate(0 ${n(bob)})`);
    wing.setAttribute('transform',`rotate(${n(Math.sin(phase)*2.8)} 520 350)`);
  }
  function frame(ts){
    if(!playing)return;
    if(!last)last=ts;
    const dt=Math.min(40,Math.max(0,ts-last));
    last=ts;
    phase=(phase+dt*0.0047*speed)%(Math.PI*2);
    wheel=(wheel+dt*0.12*speed)%360;
    travel+=dt*0.085*speed;
    update(ts);
    raf=requestAnimationFrame(frame);
  }
  function start(){
    if(playing&&raf)return;
    playing=true; last=0;
    play.setAttribute('aria-pressed','true');
    play.textContent='暂停动画';
    raf=requestAnimationFrame(frame);
  }
  function stop(){
    playing=false;
    if(raf)cancelAnimationFrame(raf);
    raf=0;
    play.setAttribute('aria-pressed','false');
    play.textContent='继续骑行';
  }
  play.addEventListener('click',()=>{playing?stop():start();});
  speedButtons.forEach(btn=>btn.addEventListener('click',()=>{
    speed=Number(btn.dataset.speed)||1;
    speedButtons.forEach(x=>x.setAttribute('aria-pressed',String(x===btn)));
  }));
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
    else if(playing){raf=requestAnimationFrame(frame);}
  });
  update(0);
  if(playing)raf=requestAnimationFrame(frame); else stop();
})();
</script>
</body>
</html>
